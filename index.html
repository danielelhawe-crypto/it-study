<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>امتحان Database 1 - التفاعلي للهاتف</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col p-4">

    <header class="bg-slate-900 text-white p-4 rounded-2xl shadow-md mb-4 text-center">
        <h1 class="text-lg font-extrabold">امتحان تجريبي تفاعلي - Database 1</h1>
        <p class="text-xs text-emerald-400 mt-1">20 سؤالاً (5 True/False و 15 MCQ) طبقاً لشكل امتحان الميدتيرم</p>
    </header>

    <main id="quiz-box" class="space-y-4 max-w-xl mx-auto w-full pb-10">
        <!-- تظهر الأسئلة هنا تفاعلياً -->
    </main>

    <div id="result-box" class="hidden bg-white p-6 rounded-2xl shadow-lg text-center space-y-4 max-w-xl mx-auto w-full">
        <h2 class="text-2xl font-extrabold text-slate-900">نتيجة الامتحان</h2>
        <div id="score-display" class="text-4xl font-extrabold text-emerald-600">0 / 25</div>
        <p id="grade-comment" class="text-sm text-slate-600"></p>
        <button onclick="location.reload()" class="px-6 py-3 bg-sky-600 text-white font-bold rounded-xl w-full">إعادة الامتحان 🔄</button>
    </div>

    <script>
        const examQuestions = [
            { q: "1. Traditional file-processing systems inherently eliminate data redundancy across applications.", type: "tf", opts: ["True", "False"], correct: 1, exp: "خطأ: أنظمة الملفات تعاني من تكرار البيانات وتضاربها." },
            { q: "2. The Durability property of ACID guarantees that committed changes survive crashes.", type: "tf", opts: ["True", "False"], correct: 0, exp: "صواب: Durability تضمن بقاء التغييرات بعد الـ Commit." },
            { q: "3. In a relational table, columns are referred to as Tuples and rows as Attributes.", type: "tf", opts: ["True", "False"], correct: 1, exp: "خطأ: الأعمدة Attributes والصفوف Tuples." },
            { q: "4. When a network partition occurs, a CP system under CAP Theorem rejects requests to prevent stale data.", type: "tf", opts: ["True", "False"], correct: 0, exp: "صواب: نظام CP يفضل صحة البيانات ويرفض الاستجابة عند انقطاع الشبكة." },
            { q: "5. The Data-Definition Language (DDL) is used to specify database schemas, table structures, and constraints.", type: "tf", opts: ["True", "False"], correct: 0, exp: "صواب: DDL تستخدم لتصميم الهيكل (CREATE, ALTER)." },
            { q: "6. What academic term corresponds to a single horizontal row in a relational table?", type: "mcq", opts: ["Domain", "Tuple", "Attribute", "Field"], correct: 1, exp: "الصف الأفقي هو Tuple." },
            { q: "7. Which component of a DBMS stores structural definitions, data types, and primary keys (Metadata)?", type: "mcq", opts: ["Application Cache", "Data Dictionary (System Catalog)", "Client Storage", "Query Log"], correct: 1, exp: "معجم البيانات Data Dictionary يحفظ الـ Metadata." },
            { q: "8. Which ACID property enforces 'All or Nothing', rolling back if an error occurs mid-transaction?", type: "mcq", opts: ["Atomicity", "Consistency", "Isolation", "Durability"], correct: 0, exp: "خاصية Atomicity (الأتمتة)." },
            { q: "9. Upgrading a single database server by adding more CPU cores, RAM, and storage is known as:", type: "mcq", opts: ["Horizontal Scaling", "Vertical Scaling (Scale Up)", "Sharding", "Partitioning"], correct: 1, exp: "التوسع الرأسي Vertical Scaling." },
            { q: "10. In a 3-tier architecture, where are business rules processed and SQL queries prepared?", type: "mcq", opts: ["Database Server", "Application Server", "Client Browser", "Data Dictionary"], correct: 1, exp: "خادم التطبيق Application Server." },
            { q: "11. What is the primary function of a database schema?", type: "mcq", opts: ["To store temporary user sessions", "To define the overall logical design and structure", "To execute DML INSERT queries", "To format client UI"], correct: 1, exp: "تحديد التصميم الهيكلي والمنطقي للقاعدة." },
            { q: "12. Which NoSQL database family organizes data into dynamic JSON/BSON documents?", type: "mcq", opts: ["Key-Value Stores", "Document Databases", "Wide-Column Stores", "Graph Databases"], correct: 1, exp: "Document Databases مثل MongoDB." },
            { q: "13. What problem occurs when concurrent user processes update the same data simultaneously without coordination?", type: "mcq", opts: ["Data Independence", "Concurrent-access anomaly (Lost Update)", "Active Dictionary sync", "Referential integrity"], correct: 1, exp: "مشكلة التزامن والتحديث المفقود." },
            { q: "14. Who introduced the Relational Model for database management systems?", type: "mcq", opts: ["Jim Gray", "Edgar F. Codd", "Alan Turing", "Charles Bachman"], correct: 1, exp: "العالم E.F. Codd." },
            { q: "15. Which type of integrity constraint ensures a Foreign Key value matches a Primary Key in the parent table?", type: "mcq", opts: ["Domain Constraint", "Referential Integrity", "Authorization Rule", "Assertion"], correct: 1, exp: "سلامة المراجع Referential Integrity." },
            { q: "16. What differentiates an Active Data Dictionary from a Passive one?", type: "mcq", opts: ["Active updates instantly and automatically with accesses", "Active requires batch processing", "Passive is faster for NoSQL", "Passive stores vector embeddings"], correct: 0, exp: "Active يتحدث أوتوماتيكياً وفورياً." },
            { q: "17. What does Procedural DML specify compared to Declarative DML?", type: "mcq", opts: ["What data is needed only", "What data is needed AND how to get it", "Only table structures", "Only user passwords"], correct: 1, exp: "Procedural تحدد ماذا وكيف (What and How)." },
            { q: "18. What scaling strategy do traditional relational SQL databases natively favor?", type: "mcq", opts: ["Horizontal Sharding", "Vertical Scaling", "Decentralized P2P", "Unstructured Replication"], correct: 1, exp: "التوسع الرأسي Vertical Scaling." },
            { q: "19. In the BASE consistency model, what does 'Eventual Consistency' mean?", type: "mcq", opts: ["Data is never consistent", "Data becomes identical across all nodes after some time", "Transactions fail instantly", "Schemas are strictly enforced"], correct: 1, exp: "تطابق البيانات في كل العقد بعد فترة زمنية قصيرة." },
            { q: "20. What is the primary purpose of physical data independence?", type: "mcq", opts: ["To change physical storage without altering application programs", "To delete all DDL metadata", "To convert SQL to NoSQL", "To enforce user passwords"], correct: 0, exp: "عدم تأثر البرامج بتغييرات التخزين الفيزيائي." }
        ];

        const box = document.getElementById('quiz-box');
        
        function renderQuiz() {
            box.innerHTML = '';
            examQuestions.forEach((item, idx) => {
                let optsHTML = '';
                item.opts.forEach((opt, oIdx) => {
                    optsHTML += `
                        <label class="block p-3 bg-white rounded-xl border border-slate-200 cursor-pointer hover:bg-sky-50 transition text-sm font-medium">
                            <input type="radio" name="q_${idx}" value="${oIdx}" class="ml-2"> ${opt}
                        </label>
                    `;
                });
                box.innerHTML += `
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
                        <span class="text-xs font-bold text-sky-600 bg-sky-50 px-2.5 py-1 rounded-full">سؤال ${idx + 1}</span>
                        <h3 class="font-bold text-slate-900 text-sm leading-relaxed">${item.q}</h3>
                        <div class="space-y-2">${optsHTML}</div>
                        <div id="exp_${idx}" class="hidden p-3 bg-amber-50 border border-amber-200 rounded-xl text-xs text-amber-900 mt-2">
                            <strong>💡 التوضيح:</strong> ${item.exp}
                        </div>
                    </div>
                `;
            });
            box.innerHTML += `<button onclick="submitExam()" class="w-full py-4 bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold rounded-2xl shadow-lg mt-4">تسليم الامتحان ورصد الدرجة 📋</button>`;
        }

        function submitExam() {
            let correct = 0;
            examQuestions.forEach((item, idx) => {
                const selected = document.querySelector(`input[name="q_${idx}"]:checked`);
                const expDiv = document.getElementById(`exp_${idx}`);
                expDiv.classList.remove('hidden');
                if (selected && parseInt(selected.value) === item.correct) {
                    correct++;
                }
            });

            const finalMark = Math.round((correct / 20) * 25);
            document.getElementById('score-display').innerText = `${finalMark} / 25`;
            document.getElementById('grade-comment').innerText = finalMark >= 20 ? 'ممتاز جداً! جاهز لفل امتياز الميدتيرم 🚀' : 'متاز، راجع نقاط الشرح بالأعلى لتثبيت المعلومة 💡';
            
            box.classList.add('hidden');
            document.getElementById('result-box').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        renderQuiz();
    </script>
</body>
</html>
