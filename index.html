<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار نظم المعلومات — كل الفصول</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --card: #1e2130;
    --border: #2a2e42;
    --accent: #4f8ef7;
    --accent2: #7c5cfc;
    --green: #22c55e;
    --red: #ef4444;
    --yellow: #f59e0b;
    --text: #e8eaf6;
    --muted: #8892b0;
    --ch1: #4f8ef7;
    --ch2: #a855f7;
    --ch3: #22c55e;
    --ch4: #f59e0b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Cairo', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    direction: rtl;
  }

  /* ===== HEADER ===== */
  .header {
    background: linear-gradient(135deg, #1a1d27 0%, #0f1117 100%);
    border-bottom: 1px solid var(--border);
    padding: 2rem 1.5rem 1.5rem;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header h1 {
    font-size: clamp(1.4rem, 4vw, 2rem);
    font-weight: 900;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 0.5rem;
  }

  .header p { color: var(--muted); font-size: 0.9rem; }

  /* ===== SCOREBOARD ===== */
  .scoreboard {
    display: flex;
    justify-content: center;
    gap: 1rem;
    padding: 1rem 1.5rem;
    flex-wrap: wrap;
  }

  .score-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0.6rem 1.2rem;
    text-align: center;
    min-width: 100px;
  }

  .score-box .num {
    font-size: 1.6rem;
    font-weight: 900;
    display: block;
  }

  .score-box .label {
    font-size: 0.75rem;
    color: var(--muted);
  }

  .score-box.correct .num { color: var(--green); }
  .score-box.wrong .num  { color: var(--red); }
  .score-box.remain .num { color: var(--accent); }
  .score-box.pct .num    { color: var(--yellow); }

  /* ===== PROGRESS BAR ===== */
  .progress-wrap {
    padding: 0 1.5rem 1rem;
    max-width: 700px;
    margin: 0 auto;
  }

  .progress-bar {
    height: 6px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 99px;
    transition: width 0.4s ease;
  }

  /* ===== CHAPTER TABS ===== */
  .tabs {
    display: flex;
    gap: 0.5rem;
    padding: 0.5rem 1.5rem 0;
    overflow-x: auto;
    scrollbar-width: none;
    justify-content: center;
    flex-wrap: wrap;
  }

  .tab-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 0.45rem 1.1rem;
    border-radius: 99px;
    cursor: pointer;
    font-family: 'Cairo', sans-serif;
    font-size: 0.82rem;
    font-weight: 600;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .tab-btn:hover { border-color: var(--accent); color: var(--text); }
  .tab-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tab-btn.ch1.active { background: var(--ch1); border-color: var(--ch1); }
  .tab-btn.ch2.active { background: var(--ch2); border-color: var(--ch2); }
  .tab-btn.ch3.active { background: var(--ch3); border-color: var(--ch3); }
  .tab-btn.ch4.active { background: var(--ch4); border-color: var(--ch4); }

  /* ===== MAIN CONTENT ===== */
  .main { max-width: 760px; margin: 0 auto; padding: 1.5rem; }

  .chapter-section { display: none; }
  .chapter-section.active { display: block; }

  .chapter-header {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    margin-bottom: 1.5rem;
  }

  .chapter-badge {
    padding: 0.3rem 0.9rem;
    border-radius: 99px;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  .ch1 .chapter-badge { background: rgba(79,142,247,0.15); color: var(--ch1); border: 1px solid rgba(79,142,247,0.3); }
  .ch2 .chapter-badge { background: rgba(168,85,247,0.15); color: var(--ch2); border: 1px solid rgba(168,85,247,0.3); }
  .ch3 .chapter-badge { background: rgba(34,197,94,0.15);  color: var(--ch3); border: 1px solid rgba(34,197,94,0.3); }
  .ch4 .chapter-badge { background: rgba(245,158,11,0.15); color: var(--ch4); border: 1px solid rgba(245,158,11,0.3); }

  .chapter-title {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--text);
  }

  /* ===== QUESTION CARD ===== */
  .q-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.4rem;
    margin-bottom: 1.2rem;
    transition: border-color 0.2s;
  }

  .q-card:hover { border-color: #3a3e52; }

  .q-header {
    display: flex;
    align-items: flex-start;
    gap: 0.8rem;
    margin-bottom: 1rem;
  }

  .q-num {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.72rem;
    font-weight: 700;
    padding: 0.2rem 0.55rem;
    border-radius: 6px;
    min-width: 2.2rem;
    text-align: center;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .q-text {
    font-size: 0.95rem;
    font-weight: 600;
    line-height: 1.6;
    color: var(--text);
  }

  /* ===== OPTIONS ===== */
  .options { display: flex; flex-direction: column; gap: 0.55rem; }

  .option {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.7rem 1rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.18s;
    font-family: 'Cairo', sans-serif;
    font-size: 0.88rem;
    text-align: right;
    direction: rtl;
    width: 100%;
  }

  .option:hover:not(.answered) {
    border-color: var(--accent);
    background: rgba(79,142,247,0.08);
  }

  .option-letter {
    width: 26px;
    height: 26px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: 700;
    flex-shrink: 0;
    transition: all 0.18s;
  }

  .option-text { flex: 1; line-height: 1.5; }

  /* Answered states */
  .option.correct-ans {
    border-color: var(--green);
    background: rgba(34,197,94,0.1);
  }
  .option.correct-ans .option-letter {
    background: var(--green);
    border-color: var(--green);
    color: #fff;
  }

  .option.wrong-ans {
    border-color: var(--red);
    background: rgba(239,68,68,0.08);
  }
  .option.wrong-ans .option-letter {
    background: var(--red);
    border-color: var(--red);
    color: #fff;
  }

  .option.revealed-correct {
    border-color: rgba(34,197,94,0.5);
    background: rgba(34,197,94,0.05);
  }
  .option.revealed-correct .option-letter {
    border-color: var(--green);
    color: var(--green);
  }

  /* ===== EXPLANATION ===== */
  .explanation {
    display: none;
    margin-top: 1rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  .explanation.show { display: block; animation: fadeUp 0.25s ease; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .exp-verdict {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.7rem 1rem;
    border-bottom: 1px solid var(--border);
    font-weight: 700;
    font-size: 0.9rem;
  }

  .exp-verdict.correct { color: var(--green); }
  .exp-verdict.wrong   { color: var(--red); }
  .exp-verdict .icon   { font-size: 1.1rem; }

  .exp-body {
    padding: 0.9rem 1rem;
    font-size: 0.87rem;
    line-height: 1.8;
    color: #cdd6f4;
    white-space: pre-line;
  }

  .exp-why {
    background: rgba(79,142,247,0.06);
    border-top: 1px solid var(--border);
    padding: 0.7rem 1rem;
    font-size: 0.83rem;
    color: var(--muted);
    line-height: 1.7;
  }

  /* ===== RESULT SUMMARY ===== */
  .result-banner {
    display: none;
    background: linear-gradient(135deg, var(--surface), var(--card));
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2rem;
    text-align: center;
    margin-bottom: 1.5rem;
  }

  .result-banner.show { display: block; animation: fadeUp 0.4s ease; }

  .result-banner .score-big {
    font-size: 3rem;
    font-weight: 900;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .result-banner .grade { font-size: 1.1rem; color: var(--muted); margin-top: 0.3rem; }

  .result-banner .breakdown {
    display: flex;
    justify-content: center;
    gap: 1.5rem;
    margin-top: 1rem;
    flex-wrap: wrap;
  }

  .result-banner .bd-item { text-align: center; }
  .result-banner .bd-item .bd-num { font-size: 1.3rem; font-weight: 700; }
  .result-banner .bd-item .bd-lbl { font-size: 0.75rem; color: var(--muted); }
  .bd-item.c .bd-num { color: var(--green); }
  .bd-item.w .bd-num { color: var(--red); }
  .bd-item.s .bd-num { color: var(--yellow); }

  /* ===== RESET BUTTON ===== */
  .reset-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    border: none;
    padding: 0.7rem 2rem;
    border-radius: 10px;
    cursor: pointer;
    font-family: 'Cairo', sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    margin-top: 1rem;
    transition: opacity 0.2s;
  }

  .reset-btn:hover { opacity: 0.85; }

  /* ===== ANSWERED STATE (lock cursor) ===== */
  .option.answered { cursor: default; pointer-events: none; }

  /* Mobile */
  @media (max-width: 500px) {
    .header { padding: 1.2rem 1rem 1rem; }
    .main { padding: 1rem; }
    .q-card { padding: 1rem; }
    .option { padding: 0.6rem 0.8rem; font-size: 0.83rem; }
    .scoreboard { gap: 0.6rem; }
    .score-box { min-width: 80px; padding: 0.5rem 0.8rem; }
    .score-box .num { font-size: 1.3rem; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>📚 اختبار نظم المعلومات — الشامل</h1>
  <p>كل أسئلة البنك + الميدترم — Chapter 1, 2, 3, 4</p>
</div>

<div class="scoreboard">
  <div class="score-box correct"><span class="num" id="sc-correct">0</span><span class="label">✅ صح</span></div>
  <div class="score-box wrong">  <span class="num" id="sc-wrong">0</span>  <span class="label">❌ غلط</span></div>
  <div class="score-box remain"> <span class="num" id="sc-remain">0</span> <span class="label">⏳ متبقي</span></div>
  <div class="score-box pct">   <span class="num" id="sc-pct">0%</span>  <span class="label">🎯 نسبة</span></div>
</div>

<div class="progress-wrap">
  <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
</div>

<div class="tabs">
  <button class="tab-btn ch1 active" onclick="showChapter('ch1')">Chapter 1</button>
  <button class="tab-btn ch2"        onclick="showChapter('ch2')">Chapter 2</button>
  <button class="tab-btn ch3"        onclick="showChapter('ch3')">Chapter 3</button>
  <button class="tab-btn ch4"        onclick="showChapter('ch4')">Chapter 4</button>
  <button class="tab-btn"            onclick="showChapter('midterm')">Midterm</button>
</div>

<div class="main" id="main-content"></div>

<script>
// ============================================================
//  DATA — ALL QUESTIONS
// ============================================================
const chapters = {

ch1: {
  title: "Chapter 1 — نظم المعلومات: المفاهيم الأساسية",
  badge: "الفصل الأول",
  colorClass: "ch1",
  questions: [
    { q:"Information systems help us in …………", opts:["Improve process of organization","Making right decision","Decrease effort and saving money","All the above"], ans:3,
      why:"نظام المعلومات يحقق الثلاثة مع بعض: يحسّن العمليات، يدعم القرار الصحيح، ويقلل الجهد والتكلفة.",
      exp:"✅ (d) All the above\n❌ (a), (b), (c) كل منهم صح لكن ناقصة — الإجابة الكاملة هي كل ما سبق." },
    { q:"………….. is a set of interrelated components that collect, manipulate, store, disseminate data.", opts:["Information technology","Information systems","Information","None of the above"], ans:1,
      why:"هذا هو التعريف الدقيق لـ«نظام المعلومات».",
      exp:"✅ (b) Information systems\n❌ (a) IT = الأجهزة والبرمجيات فقط بدون العنصر البشري\n❌ (c) Information = المعلومات الناتجة، مش النظام نفسه\n❌ (d) في إجابة صح" },
    { q:"………… is responsible for enhancing internal efficiency within the company.", opts:["CIO","CTO","CEO","None of the above"], ans:0,
      why:"الـ CIO مسؤول عن استخدام تقنية المعلومات لتحسين الكفاءة الداخلية.",
      exp:"✅ (a) CIO\n❌ (b) CTO = يطوّر منتجات تقنية للعملاء الخارجيين\n❌ (c) CEO = يدير الشركة ككل ومسؤول عن القرارات الكبرى\n❌ (d) في إجابة صح" },
    { q:"………… is responsible for developing technological product to meet customer needs.", opts:["CIO","CTO","CEO","None of the above"], ans:1,
      why:"الـ CTO هو المسؤول عن تطوير المنتجات التقنية الموجهة لتلبية احتياجات العملاء.",
      exp:"✅ (b) CTO\n❌ (a) CIO = يحسّن الكفاءة الداخلية\n❌ (c) CEO = يدير الشركة ككل\n❌ (d) في إجابة صح" },
    { q:"………… is the highest IS ranking manager.", opts:["CIO","CTO","CEO","None of the above"], ans:0,
      why:"الـ CIO هو أعلى منصب إداري داخل قسم نظم المعلومات تحديداً.",
      exp:"✅ (a) CIO\n❌ (b) CTO = بيتبع التقنية والمنتجات\n❌ (c) CEO = أعلى منصب في الشركة كلها، مش في IS تحديداً\n❌ (d) في إجابة صح" },
    { q:"………… is the highest-ranking executive in a company responsible for making major corporate decisions.", opts:["CIO","CTO","CEO","None of the above"], ans:2,
      why:"الـ CEO هو أعلى منصب تنفيذي في الشركة ككل.",
      exp:"✅ (c) CEO\n❌ (a) CIO = مسؤول عن IS فقط\n❌ (b) CTO = مسؤول عن التقنية والمنتجات" },
    { q:"……………. Focus on understanding websites.", opts:["Web analyst","System analyst","Web designer","Data analyst"], ans:0,
      why:"محلل الويب (Web analyst) متخصص في تحليل وفهم أداء المواقع وسلوك الزوار.",
      exp:"✅ (a) Web analyst\n❌ (b) System analyst = حلقة وصل بين العميل والمبرمج\n❌ (c) Web designer = يصمّم شكل الموقع\n❌ (d) Data analyst = يستخدم البيانات لحل مشكلات العمل" },
    { q:"……………… is responsible for building systems and communicate between programmer and client.", opts:["Web analyst","System analyst","System designer","Data analyst"], ans:1,
      why:"محلل النظم (System analyst) هو حلقة الوصل: يفهم متطلبات العميل ويترجمها لتصميم قابل للبناء.",
      exp:"✅ (b) System analyst\n❌ (a) Web analyst = يحلل مواقع الويب\n❌ (c) System designer = يصمّم النظام بعد تحليله\n❌ (d) Data analyst = يستخدم البيانات لحل المشكلات" },
    { q:"…………….. use data to solve business problems.", opts:["Web analyst","System analyst","Web designer","Data analyst"], ans:3,
      why:"محلل البيانات (Data analyst) متخصص في استخدام البيانات لحل مشكلات العمل.",
      exp:"✅ (d) Data analyst\n❌ (a) Web analyst = يحلل المواقع\n❌ (b) System analyst = وسيط بين العميل والمبرمج\n❌ (c) Web designer = يصمّم واجهات المواقع" },
    { q:"You can make decisions based on data and knowledge?", opts:["True","False"], ans:0,
      why:"نعم، البيانات عند تحليلها تتحول لمعلومات ثم لمعرفة يُعتمد عليها في اتخاذ القرار.",
      exp:"✅ True — البيانات والمعرفة أساس اتخاذ القرار في نظم المعلومات." },
    { q:"………… is/are characteristics of good information.", opts:["Secure and timely","Accurate and accessible","Complete and related","All the above"], ans:3,
      why:"المعلومة الجيدة لازم تجمع كل الخصائص: الأمان، التوقيت، الدقة، سهولة الوصول، الاكتمال، والارتباط بالموضوع.",
      exp:"✅ (d) All the above\n❌ (a), (b), (c) كل واحدة صح لكن ناقصة." },
    { q:"Timely information means …………", opts:["Information that can be accessed in a short interval of time","Information that come at time that we need it","Information that proceeds in a short interval of time","None of the above"], ans:1,
      why:"«في الوقت المناسب» تعني وصول المعلومة عند الحاجة الفعلية لها لاتخاذ القرار.",

    { q:"………. Is responsible for managing new systems development projects.", opts:["System manager","Project manager","CTO","CEO"], ans:1,
      why:"مدير المشروع (Project manager) مسؤول عن إدارة مشاريع تطوير الأنظمة الجديدة.",
      exp:"✅ (b) Project manager\n❌ (a) System manager = يدير الأنظمة الموجودة أصلاً\n❌ (c) CTO = يطوّر منتجات تقنية للعملاء" },
    { q:"………. Is responsible for managing existing systems.", opts:["System manager","Project manager","CTO","CEO"], ans:0,
      why:"مدير النظام (System manager) مسؤول عن صيانة وإدارة الأنظمة العاملة بالفعل.",
      exp:"✅ (a) System manager\n❌ (b) Project manager = يدير مشاريع الأنظمة الجديدة\n❌ (c) CTO = يطوّر منتجات للعملاء" },
    { q:"………. Overseas the ethical and legal use of IS.", opts:["Computer security manager","Lawyer of the company","Auditing","A and C"], ans:3,
      why:"كل من مدير أمن الحاسوب والتدقيق (Auditing) يشتركان في مراقبة الاستخدام الأخلاقي والقانوني.",
      exp:"✅ (d) A and C\n❌ (b) محامي الشركة مش مسؤول عن IS تحديداً" },
    { q:"Information that has a high price is considered bad information.", opts:["True","False"], ans:0,
      why:"حسب المنهج، ارتفاع تكلفة الحصول على المعلومة يجعلها غير عملية اقتصادياً إذا لم تبرر قيمتها تكلفتها.",
      exp:"✅ True — المعلومة المكلفة جداً قد تكون معلومة سيئة من الناحية الاقتصادية." },
    { q:"Information that has a lot of details is a good information.", opts:["True","False"], ans:1,
      why:"كثرة التفاصيل ليست معياراً للجودة — الجودة تعتمد على الدقة والملاءمة لا الكم.",
      exp:"✅ False — المعلومة المثالية هي التي تحتوي على ما يكفي — لا أقل ولا أكثر." },
    { q:"A system that can self-monitor and self-regulate is called ………….", opts:["Control system","Feedback system","Cybernetic system","All the above"], ans:2,
      why:"النظام السيبراني (Cybernetic system) هو النظام القادر على مراقبة نفسه وتعديل أدائه ذاتياً.",
      exp:"✅ (c) Cybernetic system\n❌ (a) Control system = نظام تحكم عام\n❌ (b) Feedback system = يعتمد على التغذية الراجعة لكن مش بالضرورة ذاتي" },
    { q:"IS systems can operate in isolation.", opts:["True","False"], ans:1,

      exp:"✅ False\nFile Management هي التي تتتبع المواقع الفيزيائية للملفات\nUser Interface = تتعامل مع المستخدم" },

      exp:"✅ False\nLaser Printers أسرع وأفضل للكميات الكبيرة" },

      why:"الحزم المتكاملة (Integrated Packages) عادةً أصغر حجماً من Software Suites لأنها مصممة لتكون خفيفة.",
      exp:"✅ False\nIntegrated Packages أصغر حجماً من Software Suites" },

      why:"الحوسبة الشبكية (Grid computing) هي مثال على الحوسبة المتوازية بتكلفة أقل.",
      exp:"✅ True\nGrid computing = parallel computing عبر حواسيب موزعة بتكلفة اقتصادية" }

}

};

// ============================================================
//  STATE
// ============================================================
let state = {
  answers: {},   // "ch1_0": true/false
  current: 'ch1'
};

let totalQ   = 0;
let answered = 0;
let correct  = 0;
let wrong    = 0;

// Count total
for (const ch of Object.values(chapters)) totalQ += ch.questions.length;

// ============================================================
//  RENDER
// ============================================================
function showChapter(chId) {
  state.current = chId;
  document.querySelectorAll('.chapter-section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  const sec = document.getElementById('sec-' + chId);
  if (sec) sec.classList.add('active');
  const tab = document.querySelector(`.tab-btn[onclick="showChapter('${chId}')"]`);
  if (tab) tab.classList.add('active');
}

function buildAll() {
  const container = document.getElementById('main-content');
  container.innerHTML = '';

  for (const [chId, chData] of Object.entries(chapters)) {
    const sec = document.createElement('div');
    sec.className = 'chapter-section' + (chId === 'ch1' ? ' active' : '');
    sec.id = 'sec-' + chId;

    // Chapter header
    const hdr = document.createElement('div');
    hdr.className = 'chapter-header';
    hdr.innerHTML = `<span class="chapter-badge ${chData.colorClass}">${chData.badge}</span>
                     <span class="chapter-title">${chData.title}</span>`;
    sec.appendChild(hdr);

    // Result banner
    const banner = document.createElement('div');
    banner.className = 'result-banner';
    banner.id = 'banner-' + chId;
    sec.appendChild(banner);

    // Questions
    chData.questions.forEach((qObj, idx) => {
      sec.appendChild(buildCard(chId, idx, qObj));
    });

    container.appendChild(sec);
  }
}

const LETTERS = ['أ','ب','ج','د'];

function buildCard(chId, idx, qObj) {
  const card = document.createElement('div');
  card.className = 'q-card';
  card.id = `card-${chId}-${idx}`;

  card.innerHTML = `
    <div class="q-header">
      <span class="q-num">س${idx + 1}</span>
      <span class="q-text">${qObj.q}</span>
    </div>
    <div class="options" id="opts-${chId}-${idx}">
      ${qObj.opts.map((opt, i) => `
        <button class="option" onclick="answer('${chId}',${idx},${i})">
          <span class="option-letter">${LETTERS[i] || (i+1)}</span>
          <span class="option-text">${opt}</span>
        </button>
      `).join('')}
    </div>
    <div class="explanation" id="exp-${chId}-${idx}">
      <div class="exp-verdict" id="verdict-${chId}-${idx}"></div>
      <div class="exp-body" id="expbody-${chId}-${idx}"></div>
      <div class="exp-why" id="expwhy-${chId}-${idx}"></div>
    </div>
  `;
  return card;
}

// ============================================================
//  ANSWER
// ============================================================
function answer(chId, idx, chosen) {
  const key = `${chId}_${idx}`;
  if (state.answers[key] !== undefined) return; // already answered

  const qObj   = chapters[chId].questions[idx];
  const isRight = chosen === qObj.ans;

  state.answers[key] = isRight;
  if (isRight) correct++; else wrong++;
  answered++;

  // Update options
  const opts = document.querySelectorAll(`#opts-${chId}-${idx} .option`);
  opts.forEach((btn, i) => {
    btn.classList.add('answered');
    if (i === chosen && isRight)  btn.classList.add('correct-ans');
    if (i === chosen && !isRight) btn.classList.add('wrong-ans');
    if (i === qObj.ans && !isRight) btn.classList.add('revealed-correct');
  });

  // Show explanation
  const expDiv     = document.getElementById(`exp-${chId}-${idx}`);
  const verdictDiv = document.getElementById(`verdict-${chId}-${idx}`);
  const bodyDiv    = document.getElementById(`expbody-${chId}-${idx}`);
  const whyDiv     = document.getElementById(`expwhy-${chId}-${idx}`);

  expDiv.classList.add('show');
  verdictDiv.className = `exp-verdict ${isRight ? 'correct' : 'wrong'}`;
  verdictDiv.innerHTML = isRight
    ? `<span class="icon">✅</span> إجابة صحيحة! ممتاز`
    : `<span class="icon">❌</span> إجابة خاطئة — الإجابة الصحيحة: <strong>${qObj.opts[qObj.ans]}</strong>`;

  bodyDiv.textContent = qObj.exp || '';
  whyDiv.innerHTML    = `<strong>💡 لماذا؟</strong> ${qObj.why}`;

  updateScore();
  checkChapterDone(chId);
}

function updateScore() {
  document.getElementById('sc-correct').textContent = correct;
  document.getElementById('sc-wrong').textContent   = wrong;
  document.getElementById('sc-remain').textContent  = totalQ - answered;
  const pct = answered ? Math.round((correct / answered) * 100) : 0;
  document.getElementById('sc-pct').textContent     = pct + '%';
  document.getElementById('prog-fill').style.width  = ((answered / totalQ) * 100) + '%';
}

function checkChapterDone(chId) {
  const chData = chapters[chId];
  const total  = chData.questions.length;
  let   done   = 0;
  let   chCorr = 0;
  let   chWrong = 0;

  for (let i = 0; i < total; i++) {
    const k = `${chId}_${i}`;
    if (state.answers[k] !== undefined) {
      done++;
      if (state.answers[k]) chCorr++; else chWrong++;
    }
  }

  if (done === total) {
    const banner = document.getElementById('banner-' + chId);
    const pct = Math.round((chCorr / total) * 100);
    let grade = '';
    if (pct >= 90) grade = '🏆 ممتاز جداً!';
    else if (pct >= 75) grade = '👍 جيد جداً';
    else if (pct >= 60) grade = '✌️ مقبول — راجع الأخطاء';
    else grade = '📖 تحتاج مراجعة';

    banner.innerHTML = `
      <div class="score-big">${pct}%</div>
      <div class="grade">${grade}</div>
      <div class="breakdown">
        <div class="bd-item c"><div class="bd-num">${chCorr}</div><div class="bd-lbl">صح</div></div>
        <div class="bd-item w"><div class="bd-num">${chWrong}</div><div class="bd-lbl">غلط</div></div>
        <div class="bd-item s"><div class="bd-num">${total}</div><div class="bd-lbl">إجمالي</div></div>
      </div>
      <button class="reset-btn" onclick="resetChapter('${chId}')">🔄 إعادة المحاولة</button>
    `;
    banner.classList.add('show');
    banner.scrollIntoView({ behavior:'smooth', block:'center' });
  }
}

function resetChapter(chId) {
  const chData = chapters[chId];
  for (let i = 0; i < chData.questions.length; i++) {
    const key = `${chId}_${i}`;
    if (state.answers[key] !== undefined) {
      if (state.answers[key]) correct--; else wrong--;
      answered--;
      delete state.answers[key];
    }
  }

  // Rebuild section
  const sec = document.getElementById('sec-' + chId);
  if (sec) {
    sec.innerHTML = `
      <div class="chapter-header">
        <span class="chapter-badge ${chData.colorClass}">${chData.badge}</span>
        <span class="chapter-title">${chData.title}</span>
      </div>
      <div class="result-banner" id="banner-${chId}"></div>
    `;
    chData.questions.forEach((qObj, idx) => {
      sec.appendChild(buildCard(chId, idx, qObj));
    });
  }

  updateScore();
}

// ============================================================
//  INIT
// ============================================================
buildAll();
updateScore();
</script>
</body>
</html>
