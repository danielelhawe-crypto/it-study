            { id: 60, cat: "Final Check", q: "60. ما هو التلخيص الأهم للامتحان والمنهج ككل؟", opts: ["أن الـ DBMS يحل مشاكل الملفات التقليدية عبر ACID والعلائقية والمعمارية الآمنة لضمان استقرار الأنظمة", "أن الملفات أفضل من الـ DBMS", "أن NoSQL تلغي SQL تماماً", "أن المنهج نظري فقط"], correct: 0, exp: "الهدف الأسمى لنظام قواعد البيانات هو تجاوز مشاكل الملفات وتحقيق الكفاءة والأمان." }
        ];

        let score = 0;
        let answered = 0;
        const container = document.getElementById('quiz-container');

        function renderQuiz() {
            container.innerHTML = '';
            questions60.forEach((item, idx) => {
                let optsHTML = '';
                item.opts.forEach((opt, oIdx) => {
                    optsHTML += `
                        <label class="block p-3 bg-white rounded-xl border border-slate-200 cursor-pointer hover:bg-sky-50 transition text-sm font-medium option-label-${item.id}">
                            <input type="radio" name="q_${item.id}" value="${oIdx}" onclick="checkAnswer(${item.id}, ${oIdx}, ${item.correct})" class="ml-2"> ${opt}
                        </label>
                    `;
                });

                container.innerHTML += `
                    <div class="bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-slate-200 space-y-3 text-right" id="card_${item.id}">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-bold text-sky-700 bg-sky-50 px-2.5 py-1 rounded-full border border-sky-100">${item.cat}</span>
                            <span class="text-xs font-mono text-slate-400">سؤال ${idx + 1} من 60</span>
                        </div>
                        <h3 class="font-bold text-slate-900 text-sm sm:text-base leading-relaxed">${item.q}</h3>
                        <div class="space-y-2" id="opts_${item.id}">${optsHTML}</div>
                        <div id="feedback_${item.id}" class="hidden p-3 rounded-xl text-xs font-medium mt-2"></div>
                    </div>
                `;
            });
        }

        function checkAnswer(qId, selectedIdx, correctIdx) {
            const card = document.getElementById(`card_${qId}`);
            const feedback = document.getElementById(`feedback_${qId}`);
            const item = questions60.find(q => q.id === qId);

            // منع إعادة الإجابة لنفس السؤال
            const radios = document.querySelectorAll(`input[name="q_${qId}"]`);
            radios.forEach(r => r.disabled = true);

            answered++;
            document.getElementById('answered-count').innerText = answered;

            const isCorrect = (selectedIdx === correctIdx);
            if (isCorrect) {
                score++;
                document.getElementById('live-score').innerText = score;
                card.classList.add('border-emerald-300', 'bg-emerald-50/20');
                feedback.className = "p-3 rounded-xl text-xs font-medium mt-2 bg-emerald-100 text-emerald-900 border border-emerald-300 block";
                feedback.innerHTML = `<strong>✅ إجابة صحيحة بامتياز!</strong><br><span class="mt-1 block">💡 الشرح: ${item.exp}</span>`;
            } else {
                card.classList.add('border-red-300', 'bg-red-50/20');
                feedback.className = "p-3 rounded-xl text-xs font-medium mt-2 bg-red-100 text-red-900 border border-red-300 block";
                feedback.innerHTML = `<strong>❌ إجابة غير صائبة.</strong> الإجابة الصحيحة هي: <span class="font-bold underline">${item.opts[correctIdx]}</span><br><span class="mt-1 block">💡 الشرح الدقيق: ${item.exp}</span>`;
            }
        }

        renderQuiz();
    </script>
